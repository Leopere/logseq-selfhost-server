<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logseq Selfhost</title>
  <style>
    :root { color-scheme: light dark; font: 15px system-ui, sans-serif; }
    body { margin: 32px; }
    h1 { font-size: 24px; }
    p { line-height: 1.5; }
    label { display: block; margin-bottom: 8px; }
    input { box-sizing: border-box; width: 100%; padding: 10px; font: inherit; }
    button { margin-top: 16px; padding: 8px 20px; font: inherit; }
    #status { min-height: 24px; font-size: 14px; }
  </style>
  <script src="selfhost-setup.js" defer></script>
</head>
<body>
  <h1>Connect your sync server</h1>
  <p>Enter the HTTPS URL and private code issued by your server operator. Use the same URL and code on your other devices.</p>
  <section id="current-settings">
  <label for="current-code">Current code</label>
  <input id="current-code" type="password" readonly autocomplete="off">
  <button type="button" id="copy-code">Copy code</button>
  <button type="button" id="reveal-code">Show</button>
  </section>
  <form id="setup">
    <label for="server-url">Sync server URL</label>
    <input id="server-url" type="url" maxlength="2048" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://sync.example.com" required>
    <label for="code" style="margin-top:16px">Issued sync code</label>
    <input id="code" type="password" maxlength="80" autocomplete="off" autocapitalize="off" spellcheck="false" required autofocus>
    <button type="submit">Connect and restart</button>
    <p id="status" role="status" aria-live="polite"></p>
  </form>
  <p>Changing the server URL keeps your local notes and encryption keys. Only connect to a server you trust.</p>
</body>
</html>
